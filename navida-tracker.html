<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navida Travel &amp; Tour — Deal Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navida-tracker.css">

</head>
<body>

<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <img src="images/logo.png" alt="Navida Travel and Tour logo" class="brand-logo">
      <div>
        <div class="brand-name">Navida Travel<br>&amp; Tour</div>
      </div>
    </div>

    <button class="btn-primary" id="openAddModal">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1V13M1 7H13" stroke="#0F2E5C" stroke-width="2" stroke-linecap="round"/></svg>
      Add customer
    </button>

    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#9FB3D6" stroke-width="1.6"/><path d="M10.5 10.5L13.5 13.5" stroke="#9FB3D6" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search customers or country">
    </div>

    <div>
      <div class="list-label"><span>Customers</span><span id="customerCount">0</span></div>
      <ul class="customer-list" id="customerList"></ul>
    </div>

    <div class="sidebar-foot">
      <button class="btn-ghost" id="exportBtn">Export data</button>
      <button class="btn-ghost" id="importBtn">Import data</button>
      <input type="file" id="importFile" accept="application/json">
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <!-- ================= MAIN ================= -->
  <main class="main" id="mainPanel"></main>

</div>

<!-- ================= ADD CUSTOMER MODAL ================= -->
<div class="modal-backdrop" id="addModal" style="display:none;">
  <div class="modal">
    <h2>New customer</h2>
    <p class="sub">Add a customer and their deal details.</p>

    <form id="addForm">
      <div class="field">
        <label for="f_name">Full name</label>
        <input type="text" id="f_name" required placeholder="e.g. Ama Boateng">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f_purpose">Purpose</label>
          <select id="f_purpose">
            <option value="School">School</option>
            <option value="Work">Work</option>
            <option value="Visit">Visit</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field" id="f_purpose_other_wrap" style="display:none;">
          <label for="f_purpose_other">Specify</label>
          <input type="text" id="f_purpose_other" placeholder="e.g. Medical trip">
        </div>
      </div>

      <div class="field">
        <label for="f_country">Destination country</label>
        <input type="text" id="f_country" required placeholder="e.g. Canada">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f_phone">Phone</label>
          <input type="text" id="f_phone" placeholder="e.g. 024 123 4567">
        </div>
        <div class="field">
          <label for="f_email">Email</label>
          <input type="text" id="f_email" placeholder="optional">
        </div>
      </div>

      <div class="field">
        <label for="f_amount">Total amount to charge (GH₵)</label>
        <input type="number" id="f_amount" min="0" step="0.01" required placeholder="e.g. 12000">
      </div>

      <div class="field">
        <label for="f_paid">Amount already paid (GH₵)</label>
        <input type="number" id="f_paid" min="0" step="0.01" value="0">
      </div>

      <div class="field">
        <label>Photo</label>
        <div class="photo-picker">
          <div class="preview" id="photoPreview">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="8" r="3.2" stroke="#9FB3D6" stroke-width="1.4"/><path d="M3 19c1.6-3.6 5-5.6 8-5.6s6.4 2 8 5.6" stroke="#9FB3D6" stroke-width="1.4"/></svg>
          </div>
          <label class="file-btn" for="f_photo">Choose photo</label>
          <input type="file" id="f_photo" accept="image/*">
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-text" id="cancelAdd">Cancel</button>
        <button type="submit" class="btn-primary" style="padding:10px 20px;">Save customer</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= CONFIRM MODAL ================= -->
<div class="modal-backdrop" id="confirmModal" style="display:none;">
  <div class="modal confirm-modal">
    <h2 id="confirmTitle">Remove customer</h2>
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button type="button" class="btn-text" id="confirmCancel">Cancel</button>
      <button type="button" class="btn-danger" id="confirmOk" style="border-color:var(--danger);">Remove</button>
    </div>
  </div>
</div>

<script src="navida-tracker.js"></script>
</body>
</html>
